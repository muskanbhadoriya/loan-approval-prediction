<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Loan Prediction System</title>
    
    <!-- Bootstrap 5 CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            font-family: 'Inter', sans-serif;
        }

        :root {
            --primary-gradient: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            --success-gradient: linear-gradient(135deg, #11998e 0%, #38ef7d 100%);
            --danger-gradient: linear-gradient(135deg, #ee0979 0%, #ff6a00 100%);
        }

        html, body {
            min-height: 100vh;
            margin: 0;
            padding: 0;
        }

        body {
            background: linear-gradient(135deg, #0f0c29 0%, #302b63 50%, #24243e 100%);
            min-height: 100vh;
            overflow-x: hidden;
        }

        /* Animated background elements */
        .bg-animation {
            position: fixed;
            width: 100%;
            height: 100%;
            top: 0;
            left: 0;
            z-index: -1;
            overflow: hidden;
        }

        .floating-shape {
            position: absolute;
            border-radius: 50%;
            opacity: 0.1;
            animation: float 15s infinite ease-in-out;
        }

        .shape-1 {
            width: 300px;
            height: 300px;
            background: #667eea;
            top: -150px;
            left: -150px;
            animation-delay: 0s;
        }

        .shape-2 {
            width: 250px;
            height: 250px;
            background: #764ba2;
            bottom: -125px;
            right: -125px;
            animation-delay: 2s;
        }

        .shape-3 {
            width: 200px;
            height: 200px;
            background: #667eea;
            top: 50%;
            right: 10%;
            animation-delay: 4s;
        }

        @keyframes float {
            0%, 100% { transform: translate(0, 0) scale(1); }
            50% { transform: translate(50px, 50px) scale(1.1); }
        }

        @keyframes slideDown {
            from {
                opacity: 0;
                transform: translateY(-30px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .container-main {
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 25px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.3),
                        0 0 100px rgba(102, 126, 234, 0.1);
            animation: slideDown 0.8s ease-out;
            overflow: hidden;
            margin: 30px auto;
            max-width: 1200px;
        }

        .header-section {
            background: var(--primary-gradient);
            color: white;
            padding: 50px 30px;
            text-align: center;
            position: relative;
            overflow: hidden;
        }

        .header-section::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: url('data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 320"><path fill="rgba(255,255,255,0.1)" fill-opacity="1" d="M0,96L48,112C96,128,192,160,288,160C384,160,480,128,576,122.7C672,117,768,139,864,144C960,149,1056,139,1152,128C1248,117,1344,107,1392,101.3L1440,96L1440,320L1392,320C1344,320,1248,320,1152,320C1056,320,960,320,864,320C768,320,672,320,576,320C480,320,384,320,288,320C192,320,96,320,48,320L0,320Z"></path></svg>') no-repeat bottom;
            background-size: cover;
            opacity: 0.3;
        }

        .header-content {
            position: relative;
            z-index: 1;
        }

        .header-section h1 {
            font-size: 3.5em;
            font-weight: 700;
            margin-bottom: 15px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.2);
        }

        .header-section p {
            font-size: 1.2em;
            opacity: 0.95;
            margin: 0;
        }

        .form-container {
            padding: 50px;
        }

        .card-section {
            background: linear-gradient(135deg, #f5f7fa 0%, #f9fafb 100%);
            border: 2px solid #e5e7eb;
            border-radius: 18px;
            padding: 30px;
            margin-bottom: 30px;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.05);
        }

        .card-section:hover {
            border-color: #667eea;
            box-shadow: 0 8px 25px rgba(102, 126, 234, 0.1);
            transform: translateY(-2px);
        }

        .section-header {
            display: flex;
            align-items: center;
            margin-bottom: 25px;
            padding-bottom: 20px;
            border-bottom: 3px solid #667eea;
        }

        .section-icon {
            font-size: 2em;
            margin-right: 15px;
            background: var(--primary-gradient);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .section-title {
            font-size: 1.4em;
            font-weight: 600;
            color: #1f2937;
            margin: 0;
        }

        .form-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
        }

        .form-group-custom {
            display: flex;
            flex-direction: column;
        }

        label {
            font-weight: 600;
            color: #374151;
            margin-bottom: 10px;
            font-size: 0.95em;
            display: flex;
            align-items: center;
        }

        label i {
            margin-right: 8px;
            color: #667eea;
            font-size: 0.9em;
        }

        input[type="number"],
        select {
            padding: 12px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 12px;
            font-family: 'Inter', sans-serif;
            font-size: 0.95em;
            transition: all 0.3s ease;
            background-color: white;
            color: #1f2937;
        }

        input[type="number"]::placeholder,
        select {
            color: #9ca3af;
        }

        input[type="number"]:focus,
        select:focus {
            outline: none;
            border-color: #667eea;
            background-color: #f0f4ff;
            box-shadow: 0 0 0 4px rgba(102, 126, 234, 0.1);
            transform: scale(1.02);
        }

        input[type="number"]:hover,
        select:hover {
            border-color: #667eea;
        }

        .form-label-icon {
            display: inline-block;
            width: 24px;
            height: 24px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            text-align: center;
            line-height: 24px;
            color: white;
            font-size: 0.75em;
            margin-right: 8px;
            flex-shrink: 0;
        }

        .button-container {
            text-align: center;
            margin-top: 50px;
            padding-top: 30px;
            border-top: 2px solid #e5e7eb;
        }

        .submit-btn {
            background: var(--primary-gradient);
            color: white;
            padding: 18px 60px;
            border: none;
            border-radius: 50px;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 10px 30px rgba(102, 126, 234, 0.4);
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .submit-btn::before {
            content: '';
            position: absolute;
            top: 0;
            left: -100%;
            width: 100%;
            height: 100%;
            background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
            transition: left 0.5s;
        }

        .submit-btn:hover::before {
            left: 100%;
        }

        .submit-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 50px rgba(102, 126, 234, 0.6);
        }

        .submit-btn:active {
            transform: translateY(-1px);
        }

        .reset-btn {
            background: linear-gradient(135deg, #6c757d 0%, #5a6268 100%);
            color: white;
            padding: 18px 60px;
            border: none;
            border-radius: 50px;
            font-size: 1.1em;
            font-weight: 700;
            cursor: pointer;
            transition: all 0.4s ease;
            box-shadow: 0 10px 30px rgba(108, 117, 125, 0.3);
            position: relative;
            overflow: hidden;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-left: 20px;
        }

        .reset-btn:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 50px rgba(108, 117, 125, 0.5);
            background: linear-gradient(135deg, #5a6268 0%, #495057 100%);
        }

        .reset-btn:active {
            transform: translateY(-1px);
        }

        .result-container {
            margin-top: 40px;
            padding: 35px;
            border-radius: 18px;
            text-align: center;
            font-size: 1.5em;
            font-weight: 700;
            min-height: 80px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: slideDown 0.6s ease-out;
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.2);
        }

        .result-approved {
            background: var(--success-gradient);
            color: white;
        }

        .result-rejected {
            background: var(--danger-gradient);
            color: white;
        }

        .result-icon {
            margin-right: 15px;
            font-size: 1.8em;
        }

        /* Tailwind responsive adjustments */
        @media (max-width: 1024px) {
            .form-container {
                padding: 40px 30px;
            }

            .card-section {
                padding: 25px;
            }
        }

        @media (max-width: 768px) {
            .header-section {
                padding: 40px 20px;
            }

            .header-section h1 {
                font-size: 2.5em;
            }

            .form-container {
                padding: 30px 20px;
            }

            .form-grid {
                grid-template-columns: 1fr;
            }

            .container-main {
                margin: 20px 15px;
                border-radius: 18px;
            }

            .submit-btn {
                padding: 15px 40px;
                font-size: 1em;
            }
        }

        /* Loading animation */
        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.5; }
        }

        .loading {
            animation: pulse 1.5s ease-in-out infinite;
        }

        /* Tooltip styles */
        .tooltip-icon {
            cursor: help;
            margin-left: 5px;
            color: #667eea;
            font-size: 0.8em;
        }
    </style>
</head>
<body>
    <!-- Animated background -->
    <div class="bg-animation">
        <div class="floating-shape shape-1"></div>
        <div class="floating-shape shape-2"></div>
        <div class="floating-shape shape-3"></div>
    </div>

    <div class="container-main">
        <div class="header-section">
            <div class="header-content">
                <h1><i class="fas fa-landmark"></i> AI Loan Predictor</h1>
                <p>
                    <i class="fas fa-brain"></i> Get instant AI-powered loan approval prediction
                </p>
            </div>
        </div>

        <div class="form-container">
            <form action="/predict" method="post" id="loanForm">

                <!-- Income Information Section -->
                <div class="form-section">
                    <h3 class="section-title">📊 Income Information</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="age">Age</label>
                            <input type="number" id="age" name="age" value="35" required>
                        </div>
                        <div class="form-group">
                            <label for="annual_income">Annual Income</label>
                            <input type="number" id="annual_income" name="annual_income" value="60000" required>
                        </div>
                        <div class="form-group">
                            <label for="monthly_income">Monthly Income</label>
                            <input type="number" id="monthly_income" name="monthly_income" value="5000" required>
                        </div>
                        <div class="form-group">
                            <label for="income_consistency">Income Consistency</label>
                            <input type="number" id="income_consistency" step="0.01" name="income_consistency" value="0.85" required>
                        </div>
                    </div>
                </div>

                <!-- Credit Information Section -->
                <div class="form-section">
                    <h3 class="section-title">💳 Credit Information</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="credit_score">Credit Score</label>
                            <input type="number" id="credit_score" name="credit_score" value="700" required>
                        </div>
                        <div class="form-group">
                            <label for="debt_to_income_ratio">Debt to Income Ratio</label>
                            <input type="number" id="debt_to_income_ratio" step="0.01" name="debt_to_income_ratio" value="0.30" required>
                        </div>
                        <div class="form-group">
                            <label for="credit_utilization">Credit Utilization</label>
                            <input type="number" id="credit_utilization" step="0.01" name="credit_utilization" value="0.45" required>
                        </div>
                        <div class="form-group">
                            <label for="num_of_open_accounts">Number of Open Accounts</label>
                            <input type="number" id="num_of_open_accounts" name="num_of_open_accounts" value="4" required>
                        </div>
                        <div class="form-group">
                            <label for="total_credit_limit">Total Credit Limit</label>
                            <input type="number" id="total_credit_limit" name="total_credit_limit" value="25000" required>
                        </div>
                        <div class="form-group">
                            <label for="current_balance">Current Balance</label>
                            <input type="number" id="current_balance" name="current_balance" value="12000" required>
                        </div>
                        <div class="form-group">
                            <label for="delinquency_history">Delinquency History</label>
                            <input type="number" id="delinquency_history" name="delinquency_history" value="0" required>
                        </div>
                        <div class="form-group">
                            <label for="public_records">Public Records</label>
                            <input type="number" id="public_records" name="public_records" value="0" required>
                        </div>
                        <div class="form-group">
                            <label for="num_of_delinquencies">Number of Delinquencies</label>
                            <input type="number" id="num_of_delinquencies" name="num_of_delinquencies" value="0" required>
                        </div>
                    </div>
                </div>

                <!-- Loan Information Section -->
                <div class="form-section">
                    <h3 class="section-title">🏦 Loan Information</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="loan_amount">Loan Amount</label>
                            <input type="number" id="loan_amount" name="loan_amount" value="25000" required>
                        </div>
                        <div class="form-group">
                            <label for="interest_rate">Interest Rate (%)</label>
                            <input type="number" id="interest_rate" step="0.01" name="interest_rate" value="5.50" required>
                        </div>
                        <div class="form-group">
                            <label for="loan_term">Loan Term (months)</label>
                            <input type="number" id="loan_term" name="loan_term" value="60" required>
                        </div>
                        <div class="form-group">
                            <label for="installment">Monthly Installment</label>
                            <input type="number" id="installment" step="0.01" name="installment" value="500" required>
                        </div>
                        <div class="form-group">
                            <label for="installment_income_ratio">Installment Income Ratio</label>
                            <input type="number" id="installment_income_ratio" step="0.01" name="installment_income_ratio" value="0.10" required>
                        </div>
                        <div class="form-group">
                            <label for="loan_purpose">Loan Purpose</label>
                            <select id="loan_purpose" name="loan_purpose" required>
                                <option value="">-- Select Purpose --</option>
                                <option>Car</option>
                                <option>Debt consolidation</option>
                                <option>Education</option>
                                <option selected>Home</option>
                                <option>Medical</option>
                                <option>Other</option>
                                <option>Vacation</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="grade_subgrade">Grade/Subgrade</label>
                            <select id="grade_subgrade" name="grade_subgrade" required>
                                <option value="">-- Select Grade --</option>
                                <option>A2</option><option>A3</option><option>A4</option><option>A5</option>
                                <option>B1</option><option selected>B2</option><option>B3</option><option>B4</option><option>B5</option>
                                <option>C1</option><option>C2</option><option>C3</option><option>C4</option><option>C5</option>
                                <option>D1</option><option>D2</option><option>D3</option><option>D4</option><option>D5</option>
                                <option>E1</option><option>E2</option><option>E3</option><option>E4</option><option>E5</option>
                                <option>F1</option><option>F2</option><option>F3</option><option>F4</option><option>F5</option>
                            </select>
                        </div>
                    </div>
                </div>

                <!-- Personal Information Section -->
                <div class="form-section">
                    <h3 class="section-title">👤 Personal Information</h3>
                    <div class="form-grid">
                        <div class="form-group">
                            <label for="gender">Gender</label>
                            <select id="gender" name="gender" required>
                                <option value="">-- Select Gender --</option>
                                <option selected>Male</option>
                                <option>Female</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="marital_status">Marital Status</label>
                            <select id="marital_status" name="marital_status" required>
                                <option value="">-- Select Status --</option>
                                <option>Married</option>
                                <option selected>Single</option>
                                <option>Widowed</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="education_level">Education Level</label>
                            <select id="education_level" name="education_level" required>
                                <option value="">-- Select Education --</option>
                                <option selected>High School</option>
                                <option>Master's</option>
                                <option>Other</option>
                                <option>PhD</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="employment_status">Employment Status</label>
                            <select id="employment_status" name="employment_status" required>
                                <option value="">-- Select Status --</option>
                                <option>Retired</option>
                                <option selected>Self-employed</option>
                                <option>Student</option>
                                <option>Unemployed</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="age_group">Age Group</label>
                            <select id="age_group" name="age_group" required>
                                <option value="">-- Select Group --</option>
                                <option selected>Mid</option>
                                <option>Senior</option>
                                <option>Old</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="button-container">
                    <button type="submit" class="submit-btn">🔍 Check Loan Status</button>
                    <button type="button" class="reset-btn" onclick="resetForm()">↻ Reset to Defaults</button>
                </div>

            </form>

            {% if prediction_text %}
                <div class="result-container {% if 'Approved' in prediction_text %}result-approved{% else %}result-rejected{% endif %}">
                    {{ prediction_text }}
                </div>
            {% endif %}
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>

    <script>
        // Default values
        const defaultValues = {
            age: 35,
            annual_income: 60000,
            monthly_income: 5000,
            debt_to_income_ratio: 0.30,
            credit_score: 700,
            loan_amount: 25000,
            interest_rate: 5.50,
            loan_term: 60,
            installment: 500,
            num_of_open_accounts: 4,
            total_credit_limit: 25000,
            current_balance: 12000,
            delinquency_history: 0,
            public_records: 0,
            num_of_delinquencies: 0,
            income_consistency: 0.85,
            credit_utilization: 0.45,
            installment_income_ratio: 0.10,
            gender: 'Male',
            marital_status: 'Single',
            education_level: 'High School',
            employment_status: 'Self-employed',
            loan_purpose: 'Home',
            grade_subgrade: 'B2',
            age_group: 'Mid'
        };

        // Load saved values on page load
        function loadSavedValues() {
            const savedValues = JSON.parse(localStorage.getItem('loanFormData')) || {};
            
            Object.keys(defaultValues).forEach(key => {
                const element = document.getElementById(key);
                if (element) {
                    const value = savedValues[key] !== undefined ? savedValues[key] : defaultValues[key];
                    element.value = value;
                }
            });
        }

        // Save form values to localStorage
        function saveFormValues() {
            const formData = {};
            Object.keys(defaultValues).forEach(key => {
                const element = document.getElementById(key);
                if (element) {
                    formData[key] = element.value;
                }
            });
            localStorage.setItem('loanFormData', JSON.stringify(formData));
        }

        // Reset form to defaults
        function resetForm() {
            Object.keys(defaultValues).forEach(key => {
                const element = document.getElementById(key);
                if (element) {
                    element.value = defaultValues[key];
                }
            });
            localStorage.removeItem('loanFormData');
            
            // Show confirmation
            showNotification('Form reset to defaults!', 'success');
        }

        // Show notification
        function showNotification(message, type) {
            const alertDiv = document.createElement('div');
            alertDiv.className = `alert alert-${type === 'success' ? 'success' : 'info'} alert-dismissible fade show`;
            alertDiv.setAttribute('role', 'alert');
            alertDiv.innerHTML = `
                ${message}
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
            `;
            
            const container = document.querySelector('.form-container');
            container.insertBefore(alertDiv, container.firstChild);
            
            setTimeout(() => {
                alertDiv.remove();
            }, 3000);
        }

        // Add event listeners to all form inputs
        function attachFormListeners() {
            const form = document.getElementById('loanForm');
            const inputs = form.querySelectorAll('input, select');
            
            inputs.forEach(input => {
                input.addEventListener('change', () => {
                    saveFormValues();
                    showNotification('✓ Value saved', 'info');
                });
                
                input.addEventListener('input', () => {
                    saveFormValues();
                });
            });
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadSavedValues();
            attachFormListeners();
        });

        // Save values before form submission
        document.getElementById('loanForm').addEventListener('submit', function() {
            saveFormValues();
        });
    </script>
</body>
</html>
